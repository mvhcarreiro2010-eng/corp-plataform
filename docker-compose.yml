version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: corp-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: corp_user
      POSTGRES_PASSWORD: corp_pass
      POSTGRES_DB: corp_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
